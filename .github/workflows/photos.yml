name: Process photos
# Runs when you add, change or delete files in photos/. Strips location data, resizes,
# writes public/photos/ and the manifest, and commits the result. Cloudflare then redeploys.
on:
  push:
    branches: [main]
    paths: ['photos/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow pillow-heif
      - run: python build/process_photos.py
      - name: Commit processed photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photos
          git diff --cached --quiet || (git commit -m "Process photos" && git push)
